services:
  web:
    build:
      context: .
      dockerfile: deploy/local-tests/Dockerfile
    ports:
      - "127.0.0.1:18080:8000"
    restart: unless-stopped
    environment:
      TQT_HOST_IP: 127.0.0.1
      TQT_DB_PATH: /data/db/tqt_produccion.db
      TQT_EXCEL_DIR: /data/excel
      TQT_EXPORTS_DIR: /data/exports
      TQT_BACKUP_DIR: /data/backups
      TZ: America/Mexico_City
    volumes:
      - test_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  test_data:
