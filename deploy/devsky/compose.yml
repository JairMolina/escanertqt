name: escanertqt
services:
  tqt:
    build:
      context: ..
      dockerfile: servidor/Dockerfile
    image: escaner-tqt:web
    restart: unless-stopped
    env_file: .env
    ports:
      - "10.200.70.2:8080:8000"
    volumes:
      - ../app:/app/app:ro
      - ../firmware/stm32_r1:/app/firmware/stm32_r1:ro
      - ../station:/app/station:ro
      - ./data/db:/data/db
      - ./data/excel_mensual:/data/excel_mensual
      - ./data/exports:/data/exports
      - ./data/respaldos:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
