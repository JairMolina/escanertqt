<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0A1020">
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/static/icons/manifest.webmanifest">
    <meta name="color-scheme" content="dark light">
    <title>Programar · Escáner TQT</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('tqt.tema')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
    <link rel="stylesheet" href="/static/css/app.css?v=1321">
</head>
<body>
<div class="app">
    <main>
        <h1 class="sr-only">Programar: captura de MAC y firmware</h1>
        <section id="visorHost" aria-label="Cámara"></section>

        <section id="activo" class="panel" aria-live="polite" aria-label="Placa seleccionada"></section>

        <section class="stack" aria-labelledby="hPend">
            <h2 class="silk" id="hPend">Pendientes de MAC</h2>
            <div class="row">
                <div class="seg grow" id="segTipo" role="group" aria-label="Filtrar por tipo">
                    <button type="button" data-f="" aria-pressed="true">Todas</button>
                    <button type="button" data-f="R1" aria-pressed="false">R1</button>
                    <button type="button" data-f="R2" aria-pressed="false">R2</button>
                </div>
            </div>
            <input class="input" id="filtro" type="search" inputmode="numeric" placeholder="Buscar por serie o nombre" aria-label="Buscar placa pendiente" autocomplete="off">
            <div id="lista" class="list"></div>
        </section>
    </main>
</div>

<script src="/static/js/common.js?v=1321"></script>
<script src="/static/js/audio.js?v=1321"></script>
<script src="/static/js/haptics.js?v=1321"></script>
<script src="/static/js/ws_client.js?v=1321"></script>
<script src="/static/js/jsQR.js?v=1321"></script>
<script src="/static/js/scanner.js?v=1321"></script>
<script src="/static/js/visor.js?v=1321"></script>
<script src="/static/js/programar.js?v=1321"></script>
</body>
</html>
