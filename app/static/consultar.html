<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0A1020">
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/static/icons/manifest.webmanifest">
    <meta name="color-scheme" content="dark light">
    <title>Consultar · Escáner TQT</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('tqt.tema')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
    <script>
    /* v1.3.44: el servidor manda al consultor de "/" a /consultar?inicio=1. Solo con esa marca, en PC/tablet (misma regla que
       index.html y la elección manual tqt.vista) sigue a la consola /monitor; si no, se queda aquí y se limpia la marca. */
    try {
        if (/[?&]inicio=1/.test(location.search)) {
            var vista = localStorage.getItem('tqt.vista');
            var pc = window.matchMedia('(min-width: 1024px) and (hover: hover) and (pointer: fine)').matches || Math.min(screen.width, screen.height) >= 700;
            if (vista === 'escritorio' || (vista !== 'movil' && pc)) location.replace('/monitor');
            else history.replaceState(null, '', '/consultar');
        }
    } catch (e) { /* sin almacenamiento: se queda la vista móvil */ }
    </script>
    <link rel="stylesheet" href="/static/css/app.css?v=1343">
</head>
<body>
<div class="app app-wide">
    <main class="consulta" id="consulta" data-has="0">
        <h1 class="sr-only">Consultar una tarjeta o PCB</h1>
        <div class="cons-side">
            <section id="visorHost" aria-label="Cámara"></section>

            <form id="formBuscar" class="row" autocomplete="off" role="search">
                <label class="sr-only" for="q">Código, número o MAC</label>
                <input class="input mono grow" id="q" type="search" maxlength="300" placeholder="Número, PCB o MAC" enterkeyhint="search" spellcheck="false">
                <button class="btn" type="submit">Buscar</button>
            </form>
        </div>

        <section id="ficha" class="stack" aria-live="polite" aria-busy="false" aria-label="Ficha de la tarjeta"></section>
    </main>
</div>

<script src="/static/js/common.js?v=1344"></script>
<script src="/static/js/audio.js?v=1321"></script>
<script src="/static/js/haptics.js?v=1321"></script>
<script src="/static/js/ws_client.js?v=1321"></script>
<script src="/static/js/jsQR.js?v=1321"></script>
<script src="/static/js/scanner.js?v=1321"></script>
<script src="/static/js/visor.js?v=1344"></script>
<script src="/static/js/consultar.js?v=1344"></script>
</body>
</html>
