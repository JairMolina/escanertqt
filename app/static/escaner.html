<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0A1020">
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/static/icons/manifest.webmanifest">
    <meta name="color-scheme" content="dark light">
    <title>Escáner para la consola · Escáner TQT</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('tqt.tema')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
    <link rel="stylesheet" href="/static/css/app.css?v=1343">
</head>
<body>
<div class="app">
    <main class="remoto stack" id="remoto">
        <h1 class="sr-only">Escáner para la consola de escritorio</h1>
        <section id="remEstado" class="rem-estado" role="status" aria-live="polite"></section>
        <section id="visorHost" aria-label="Cámara"></section>
        <form id="remForm" class="row" autocomplete="off">
            <label class="sr-only" for="remQ">Código a enviar</label>
            <input class="input mono grow" id="remQ" type="text" maxlength="300" placeholder="Código a enviar" enterkeyhint="send" spellcheck="false">
            <button class="btn" type="submit">Enviar</button>
        </form>
        <section aria-labelledby="remHist">
            <h2 class="silk" id="remHist">Enviados a la consola</h2>
            <ol id="remLista" class="rem-lista"></ol>
        </section>
    </main>
</div>

<script src="/static/js/common.js?v=1352"></script>
<script src="/static/js/audio.js?v=1321"></script>
<script src="/static/js/haptics.js?v=1321"></script>
<script src="/static/js/ws_client.js?v=1321"></script>
<script src="/static/js/jsQR.js?v=1321"></script>
<script src="/static/js/scanner.js?v=1321"></script>
<script src="/static/js/visor.js?v=1344"></script>
<script src="/static/js/escaner.js?v=1346"></script>
</body>
</html>
